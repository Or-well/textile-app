name: Release Textile

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    name: Build and release Windows x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Generate third-party notices
        run: npm run licenses:generate

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $expectedTag = "v$version"
          $actualTag = "${{ github.ref_name }}"

          if ($actualTag -ne $expectedTag) {
            throw "Tag $actualTag does not match package.json version $version."
          }

      - name: Run unit tests
        run: npm run test:unit

      - name: Build Web application
        run: npm run build

      - name: Check generated files are committed
        shell: pwsh
        run: |
          git diff --exit-code

      - name: Check Tauri release configuration
        run: npm run tauri:release:check

      - name: Build signed installers and create draft release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TEXTILE_SKIP_FRONTEND_BUILD: "1"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Textile v__VERSION__"
          releaseBody: |
            ## Changed

            - “从启动页移除项目”的确认弹窗改为轻量确认，不再要求勾选、输入项目名称和确认短语；删除本地项目文件夹仍保留强确认。

            ## Fixed

            - 修复 Windows native path 在删除项目确认弹窗和最近项目展示中可能显示 `\\?\` 系统路径前缀的问题。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
